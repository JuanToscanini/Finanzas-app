# ─── BASE DE DATOS ───────────────────────────────────────
# URL de conexión a PostgreSQL corriendo en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/finanzas_db
# Usuario y contraseña definidos al crear el contenedor Docker
spring.datasource.username=admin
spring.datasource.password=admin123
# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / HIBERNATE ─────────────────────────────────────
# validate: verifica que las entidades Java coincidan con la BD, no modifica nada
spring.jpa.hibernate.ddl-auto=validate
# Muestra en consola cada query SQL ejecutado (útil para debuggear)
spring.jpa.show-sql=true
# Formatea el SQL en consola para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# ─── FLYWAY ──────────────────────────────────────────────
# Activa Flyway para gestionar migraciones de BD
spring.flyway.enabled=true 
# Carpeta donde Flyway busca los archivos SQL de migración
spring.flyway.locations=classpath:db/migration
# Como la BD ya existe, le dice a Flyway que arranque desde el estado actual
spring.flyway.baseline-on-migrate=true

# ─── SERVIDOR ────────────────────────────────────────────
# Puerto donde corre el backend (frontend corre en 3000, no se pisan)
server.port=8080

# ─── JWT ─────────────────────────────────────────────────
jwt.secret=finanzas-app-secret-key-super-segura-minimo-32-chars
jwt.expiration=86400000
